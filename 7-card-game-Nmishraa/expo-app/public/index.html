    <script>
      (function() {
        var banner = document.getElementById('cookie-consent-banner');
        var btnAccept = document.getElementById('btn-cookie-accept');
        var btnDecline = document.getElementById('btn-cookie-decline');
        var linkPrivacy = document.getElementById('link-open-privacy');
        
        var existingConsent = null;
        try {
          existingConsent = localStorage.getItem('7cards_cookie_consent');
        } catch (e) {}

        if (!existingConsent && banner) {
          banner.style.display = 'block';
        }

        if (btnAccept) {
          btnAccept.addEventListener('click', function() {
            try {
              localStorage.setItem('7cards_cookie_consent', 'granted');
            } catch (e) {}
            if (typeof gtag === 'function') {
              gtag('consent', 'update', {
                'analytics_storage': 'granted'
              });
            }
            if (banner) banner.style.display = 'none';
          });
        }

        if (btnDecline) {
          btnDecline.addEventListener('click', function() {
            try {
              localStorage.setItem('7cards_cookie_consent', 'denied');
            } catch (e) {}
            if (typeof gtag === 'function') {
              gtag('consent', 'update', {
                'analytics_storage': 'denied'
              });
            }
            if (banner) banner.style.display = 'none';
          });
        }

        if (linkPrivacy) {
          linkPrivacy.addEventListener('click', function(e) {
            e.preventDefault();
            window.dispatchEvent(new CustomEvent('open-7cards-privacy-modal'));
          });
        }

        window.addEventListener('reopen-7cards-cookie-banner', function() {
          if (banner) banner.style.display = 'block';
        });
      })();
